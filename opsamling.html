<!DOCTYPE html>
<html lang="da">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Opsamling | Eventnavn</title>
  <link rel="stylesheet" href="./starter.css">
  <link rel="stylesheet" href="./style.css">
</head>

<body>
  <header class="site-header">
    <div class="header-content">
      <a class="site-logo" href="./">Det store bryllup</a>
      <nav class="site-nav">
        <button>Menu</button>
        <ul class="menu" id="menu" popover>
          <li><a href="./">Forside</a></li>
          <li><a href="./svg.html">Menuen</a></li>
          <li><a href="./form.html" aria-current="page">Bordkort</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main>
    <section class="opsamling-side">
      <div class="opsamling-intro">
        <h1>Bordkort</h1>
        <p>Her er dit bordkort</p>
        <div class="actions">
          <a class="button" href="./form.html">Tilbage til formular</a>
        </div>
      </div>
      <div class="opsamling-stage">
        <article class="opsamling-bordkort">
          <div>
            <header class="bordkort-header">
              <p class="bordkort-brand">Det store bryllup</p>
            </header>

            <section class="bordkort-identity">
              <h2 class="bordkort-name" id="bordkort-title">Mikkel</h2>
              <p class="bordkort-description">
                Er fra <span class="forhold"></span> side.
              </p>
            </section>

            <section class="bordkort-section" aria-labelledby="interests-title">
              <h3 id="interests-title">Glæder sig til:</h3>
              <div>
                <ul class="joys">
                  <li class="joy-one"></li>
                  <li class="joy-two"></li>
                  <li class="joy-three"></li>
                </ul>
              </div>
            </section>
          </div>
          <section class="bordkort-kendetegn"></section>
        </article>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="footer-content">
      <p>Eventnavn</p>
      <p>Footer</p>
    </div>
  </footer>
  <script src="./script.js"></script>
</body>

</html>
